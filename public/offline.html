<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08080b">
  <title>Sin conexión | Fastnet Player</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #08080b; color: #f4f4f5; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
      background-image: radial-gradient(ellipse 60% 45% at 50% 0%, rgba(255, 99, 99, .18), transparent 70%); }
    main { max-width: 360px; }
    img { width: 190px; height: auto; margin-bottom: 28px; filter: drop-shadow(0 0 28px rgba(255, 70, 70, .3)); }
    h1 { margin: 0 0 10px; font-size: 26px; letter-spacing: -.02em; }
    p { margin: 0 0 26px; color: #a1a1aa; line-height: 1.55; font-size: 15px; }
    button { border: 0; border-radius: 10px; padding: 13px 28px; background: #ff6363; color: #fff; font: 600 15px inherit; cursor: pointer; box-shadow: 0 8px 28px rgba(255, 99, 99, .35); }
    button:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <main>
    <img src="/logo-fastnet-wordmark.png" alt="Fastnet Player" width="636" height="344">
    <h1>Sin conexión</h1>
    <p>No pudimos conectarnos a internet. Revisa tu Wi-Fi o tus datos móviles y vuelve a intentarlo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </main>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
